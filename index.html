<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sulav Poudel - portfolio under construction."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="https://cdn.simpleicons.org/github" type="image/x-icon" />
    <title>Sulav Poudel</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fff;
        --foreground: #000;
        --muted: #555;
        --line: #d5d5d5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #000;
          --foreground: #fff;
          --muted: #aaa;
          --line: #333;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--background);
        color: var(--foreground);
        display: flex;
        font-family: Georgia, "Times New Roman", serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 40px 24px;
        text-align: center;
      }

      main {
        width: min(100%, 500px);
      }

      .portrait {
        border: 2px solid var(--foreground);
        box-shadow:
          0 0 0 10px var(--background),
          0 0 0 11px var(--line);
        border-radius: 50%;
        display: block;
        height: 240px;
        margin: 0 auto 36px;
        object-fit: cover;
        width: 240px;
      }

      h1 {
        font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        font-size: clamp(1.75rem, 8.5vw, 4.25rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 0.95;
        margin: 0;
        white-space: nowrap;
      }

      h1 .initial {
        display: inline-block;
        font-size: 1.15em;
        line-height: 0.8;
      }

      .rule {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 24px auto 0;
        width: min(100%, 250px);
      }

      .rule::before,
      .rule::after {
        background: var(--foreground);
        content: "";
        height: 1px;
        width: 100%;
      }

      .rule span {
        font-size: 0.7rem;
        white-space: nowrap;
      }

      .socials {
        border-bottom: 1px solid var(--line);
        border-top: 1px solid var(--line);
        display: flex;
        gap: 30px;
        justify-content: center;
        margin: 30px auto 0;
        padding: 18px 0;
      }

      .socials a {
        align-items: center;
        display: inline-flex;
        height: 36px;
        justify-content: center;
        transition: transform 160ms ease;
        width: 36px;
      }

      .socials a:hover {
        transform: translateY(-3px);
      }

      .socials img {
        border: 0;
        filter: none;
        height: 25px;
        margin: 0;
        width: 25px;
      }

      .socials img.linkedin {
        filter: brightness(0) saturate(100%) invert(29%) sepia(99%)
          saturate(1157%) hue-rotate(177deg) brightness(89%) contrast(101%);
      }

      @media (prefers-color-scheme: dark) {
        .socials img.mono {
          filter: invert(1);
        }
      }

      a:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 5px;
      }

      .status {
        color: var(--muted);
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        margin: 28px 0 0;
        text-transform: uppercase;
      }

      .status strong {
        color: var(--foreground);
        font-weight: 400;
      }

      @media (max-width: 420px) {
        .portrait {
          height: 200px;
          width: 200px;
        }

        .socials {
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="portrait" src="me.jpg" alt="Sulav Poudel" />
      <h1>
        <span class="initial">S</span>ULAV <span class="initial">P</span>OUDEL
      </h1>
      <nav class="socials" aria-label="Social links">
        <a
          href="https://github.com/603codes"
          aria-label="GitHub"
          target="_blank"
          rel="noreferrer"
          ><img class="mono" src="https://cdn.simpleicons.org/github" alt=""
        /></a>
        <a
          href="https://www.facebook.com/sulavpdl"
          aria-label="Facebook"
          target="_blank"
          rel="noreferrer"
          ><img src="https://cdn.simpleicons.org/facebook/1877F2" alt=""
        /></a>
        <a
          href="https://www.instagram.com/iota603"
          aria-label="Instagram"
          target="_blank"
          rel="noreferrer"
          ><img src="https://cdn.simpleicons.org/instagram/E4405F" alt=""
        /></a>
        <a
          href="https://www.linkedin.com/in/sulav-poudel-184880394/"
          aria-label="LinkedIn"
          target="_blank"
          rel="noreferrer"
          ><img
            class="linkedin"
            src="https://cdn.jsdelivr.net/npm/simple-icons@v13/icons/linkedin.svg"
            alt=""
        /></a>
      </nav>
      <p class="status"><strong>Portfolio</strong> / under construction</p>
    </main>
  </body>
</html>
